[project]
name = "spidervenomn"
version = "0.1.0"
description = "A 2D superhero platformer"
readme = "README.md"
authors = [{ name = "Jeff Pollock" }]
requires-python = ">=3.12"
dependencies = ["pygame-ce>=2.5.8"]

[project.scripts]
spidervenomn = "spidervenomn.__main__:main"

[dependency-groups]
build = ["pyinstaller>=6.16"]

[tool.uv]
default-groups = []

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"
